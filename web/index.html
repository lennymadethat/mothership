<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mothership</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar" hidden>
      <button id="machinePill" class="pill" title="Switch machine">
        <span class="dot" id="connDot"></span><span id="machineName">—</span>
      </button>
      <div class="spacer"></div>
      <button id="installChip" class="chip blue" title="Install app" hidden>⬇ Install</button>
      <button id="bellBtn" class="iconbtn" title="Notifications">🔔<span id="bellBadge" class="badge" hidden></span></button>
      <button id="gearBtn" class="iconbtn" title="Settings">⚙️</button>
    </header>

    <main id="view"></main>

    <nav id="tabbar" hidden>
      <button data-route="sessions"><span class="ico">💬<span id="sessBadge" class="badge" hidden></span></span>Sessions</button>
      <button data-route="terminal"><span class="ico">⌨️</span>Terminal</button>
      <button data-route="files"><span class="ico">📂</span>Files</button>
      <button data-route="fleet"><span class="ico">🛰️</span>Fleet</button>
      <button data-route="machine"><span class="ico">🖥️</span>Machine</button>
      <button data-route="history"><span class="ico">🕘</span>History</button>
    </nav>

    <div id="sheetHost"></div>
    <div id="toastHost"></div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
